<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">IH Seeds image placeholder</title>
  <desc id="description">A muted IH Seeds logo on a soft grey background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5e7e5"/>
      <stop offset="1" stop-color="#cbd0cc"/>
    </linearGradient>
    <filter id="muted-logo" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".52"/>
        <feFuncG type="linear" slope=".52"/>
        <feFuncB type="linear" slope=".52"/>
        <feFuncA type="linear" slope=".46"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="600" cy="337.5" r="230" fill="#ffffff" opacity=".16"/>
  <image href="/ih-seeds-logo.png" x="390" y="211" width="420" height="253" preserveAspectRatio="xMidYMid meet" filter="url(#muted-logo)"/>
</svg>