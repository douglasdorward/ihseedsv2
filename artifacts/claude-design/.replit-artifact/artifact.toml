kind = "web"
version = "1.0.0"
title = "IH Seeds"
previewPath = "/"
id = "artifacts/claude-design"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
ensurePreviewReachable = "/"
localPort = 24722

[services.development]
run = "pnpm --dir ../.. run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--dir", "../..", "run", "build:app" ]

[services.production.run]
args = [ "pnpm", "--dir", "../..", "run", "start" ]

[services.production.health.startup]
path = "/"

[services.env]
PORT = "24722"
BASE_PATH = "/"
