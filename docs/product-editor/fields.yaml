    label: Sowing rates
    type: object[]
    requiredForDraft: false
    requiredForPublish: false
    visibleWhen: category-not-Biologicals
    publicApi: true
    visibility: customer
    customerSurfaces: [quick-facts, comparison-table, some-category-chips, forage-chips]
    workbook: 2 Sowing rates
    fillGuidance: One row per context with min/max and unit, usually kg/ha. Forage cards chip the first range only when earlier forage pills leave a slot.

