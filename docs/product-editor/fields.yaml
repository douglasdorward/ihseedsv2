# Machine-readable product-editor field catalog.
# OpenAPI (lib/api-spec/openapi.yaml) is authoritative for types.
# Markdown tab docs are authoritative for human fill guidance.
# Keep this file in the same change as editor, API, or public-display updates.
version: 1
payloads:
  create: ProductCreateInput
  update: ProductUpdate
  draft: ProductDraftInput
visibility:
  customer: Shown on the public website
  publicApi: In PublicProduct / PublicProductDetails but not rendered on current pages
  adminOnly: Stripped by toPublicDetails; never public
# editorVisible defaults to true. false means the field is not shown in Form or
# Product page views; values are retained on save and still written by workbook import.

fields:
  - id: name
    tab: 1
    apiPath: name
    label: Product name
    type: string
    maxLength: 160
    requiredForDraft: true
    requiredForPublish: true
    visibleWhen: always
    publicApi: true
    visibility: customer
    customerSurfaces: [product-h1-default, category-cards, comparison-table, related-cards, also-popular, json-ld-name]
    workbook: 1 Products.product_name
    fillGuidance: Commercial title. Put ™/® here. H1 copies this unless overwritten on the SEO tab.

  - id: slug
    tab: 1
    apiPath: slug
    label: Slug
    type: string
    maxLength: 180
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    requiredForDraft: true
    requiredForPublish: true
    visibleWhen: always
    immutableAfterCreate: true
    publicApi: true
    visibility: customer
    customerSurfaces: [product-url]
    workbook: 1 Products.slug
    fillGuidance: Lowercase kebab-case. Permanent after create. Public URL is /products/{category}/{slug}.

  - id: category
    tab: 1
    apiPath: category
    label: Category
    type: string
    maxLength: 120
    requiredForDraft: true
    requiredForPublish: true
    visibleWhen: always
    publicApi: true
    visibility: customer
    customerSurfaces: [breadcrumb, directory, category-page, also-popular-pool]
    workbook: 1 Products.category
    fillGuidance: Active root category name. Controls which tab 3 fields appear.

  - id: subcategoryId
    tab: 1
    apiPath: subcategoryId
    label: Subcategory
    type: integer
    nullable: true
    requiredForDraft: false
    requiredForPublish: false
    visibleWhen: root-category-selected
    publicApi: true
    visibility: customer
    customerSurfaces: [category-cards, comparison-table, category-filter]
    workbook: 1 Products.sub_category
    fillGuidance: Child of the selected root, or None. None stores the root id in the current editor.

  - id: recordType
    tab: 1
    apiPath: details.recordType
    label: Record type
    type: enum
    enumValues: [Mix, Variety, "Commodity / generic"]
    requiredForDraft: true
    requiredForPublish: true
    visibleWhen: always
    publicApi: true
    visibility: customer
    customerSurfaces: [mix-components-section-when-Mix]
    workbook: 1 Products.record_type
    fillGuidance: Mix only for blended products that list components.

  - id: listingState
    tab: 1
    apiPath: listingState
    label: Listing state
    type: enum
    enumValues: [Active, New, Legacy]
    requiredForDraft: false
    requiredForPublish: false
    default: Active
    visibleWhen: always
    publicApi: true
    visibility: customer
    customerSurfaces: [main-catalogue-when-Active-or-New, new-stamp-when-New, also-in-catalogue-names-when-Legacy]
    workbook: 1 Products.listing_state
    fillGuidance: Active may sell. New may sell and shows a NEW stamp on public cards and the product page. Legacy is history only and cannot have availability. Not the same as Archive.

  - id: botanicalName
    tab: 1
    apiPath: details.botanicalName
    label: Botanical name
    type: string
    maxLength: 180
    requiredForDraft: false
    requiredForPublish: false
    visibleWhen: category-not-Mixes
    publicApi: true
    visibility: customer
    customerSurfaces: [product-hero]
    workbook: 1 Products.botanical_name
    fillGuidance: Scientific name, e.g. Lolium multiflorum.

  - id: sowingRates
    tab: 2
