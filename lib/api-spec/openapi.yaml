openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalogue
    description: Seed catalogue and availability
  - name: enquiries
    description: Advice enquiries
  - name: admin
    description: IH Seeds backoffice product management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalogue]
      summary: List pasture seed products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "409":
          description: Product name already exists
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "404":
          description: Product not found
        "409":
          description: Product name already exists
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get product management dashboard summary
      responses:
        "200":
          description: Product management summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List catalogue products with lifecycle metadata
      responses:
        "200":
          description: Admin catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getAdminProduct
      tags: [admin]
      summary: Get a product and its current draft revision
      responses:
        "200":
          description: Admin product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
  /admin/products/{id}/draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: saveProductDraftRevision
      tags: [admin]
      summary: Save a product draft revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDraftInput"
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          description: Invalid draft
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: publishProduct
      tags: [admin]
      summary: Promote the current draft to the public catalogue
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: archiveProduct
      tags: [admin]
      summary: Move a product to the archive
      responses:
        "200":
          description: Archived product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: restoreProduct
      tags: [admin]
      summary: Restore an archived product to Draft
      responses:
        "200":
          description: Draft product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/discard-draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: discardProductDraft
      tags: [admin]
      summary: Discard pending changes to a published product
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /availability:
    get:
      operationId: listAvailability
      tags: [catalogue]
      summary: List current seed availability
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityRow"
  /products/category/{category}/legacy:
    get:
      operationId: listLegacyCategoryNames
      tags: [catalogue]
      summary: List Legacy product names only
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Legacy names
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LegacyProductName" }
  /redirects/lookup:
    get:
      operationId: lookupRedirect
      tags: [catalogue]
      summary: Resolve a legacy SPA path
      parameters:
        - name: fromPath
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Redirect target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedirectLookup" }
        "404": { description: Redirect not found }
  /sitemap-products:
    get:
      operationId: getProductSitemap
      tags: [catalogue]
      summary: Active product sitemap
      responses:
        "200":
          description: XML sitemap
          content:
            application/xml:
              schema: { type: string }
  /admin/import/dry-run:
    post:
      operationId: dryRunProductImport
      tags: [admin]
      summary: Validate an XLSX import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbookUpload" }
      responses:
        "200":
          description: Dry-run report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbookReport" }
  /admin/import/commit:
    post:
      operationId: commitProductImport
      tags: [admin]
      summary: Commit a validated XLSX import
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbookCommit" }
      responses:
        "200":
          description: Import committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbookReport" }
        "400": { description: Invalid or stale token }
  /admin/import/export:
    get:
      operationId: exportProductWorkbook
      tags: [admin]
      summary: Export product workbook
      responses:
        "200":
          description: XLSX export
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /categories:
    get:
      operationId: listCategories
      tags: [catalogue]
      summary: List active catalogue categories
      responses:
        "200":
          description: Active ordered category taxonomy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCatalogueCategory"
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: List all catalogue categories
      responses:
        "200":
          description: Category records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueCategory" }
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a catalogue category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueCategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueCategory" }
        "400": { description: Invalid category or parent }
        "409": { description: Category slug already exists }
  /admin/categories/reorder:
    post:
      operationId: reorderCategories
      tags: [admin]
      summary: Reorder catalogue categories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueCategoryReorder" }
      responses:
        "200":
          description: Reordered categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueCategory" }
        "400": { description: Invalid reorder request }
        "404": { description: Category not found }
  /admin/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: updateCategory
      tags: [admin]
      summary: Update a catalogue category or its active state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueCategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueCategory" }
        "400": { description: Invalid category or parent }
        "404": { description: Category not found }
        "409": { description: Category slug already exists }
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Delete an unused catalogue category
      responses:
        "204": { description: Category deleted }
        "404": { description: Category not found }
        "409": { description: Category still has products or subcategories }
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit an advice enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryCreated"
        "400":
          description: Invalid enquiry
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        price: { type: string }
        packSize: { type: string }
        status: { type: string }
        note: { type: string }
        category: { type: string }
        subcategoryId: { type: number, multipleOf: 1, nullable: true }
        techSheet: { type: string }
        guideYear: { type: string }
        descriptionSource: { type: string, description: Admin-only provenance }
        websiteUrlLegacy: { type: string, description: Admin-only legacy URL }
        availabilityOverride: { type: [string, "null"], enum: ["Good stock", "Low stock", "Very low", Unavailable, null] }
        listingOverride: { type: [string, "null"], enum: ["Force active", "Force legacy", null] }
        listingState: { type: string, enum: [Active, Legacy] }
        saleLines:
          type: array
          items: { $ref: "#/components/schemas/SaleLine" }
        publishStatus: { type: string, enum: [Published, Draft, Archived] }
        publishedAt: { type: string, format: date-time, nullable: true }
        details:
          $ref: "#/components/schemas/ProductDetails"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, slug, price, packSize, status, note, category, techSheet, publishStatus, details, createdAt, updatedAt]
    PublicProduct:
      type: object
      description: Published, Active catalogue data. Administrative provenance, overrides, lifecycle fields, and internal notes are excluded.
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        price: { type: string }
        packSize: { type: string }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string }
        category: { type: string }
        subcategoryId: { type: [number, "null"], multipleOf: 1 }
        techSheet: { type: string }
        guideYear: { type: string }
        listingState: { type: string, enum: [Active] }
        saleLines:
          type: array
          items: { $ref: "#/components/schemas/SaleLine" }
        details:
          $ref: "#/components/schemas/PublicProductDetails"
      required: [id, name, slug, price, packSize, status, note, category, subcategoryId, techSheet, guideYear, listingState, saleLines, details]
    PublicProductDetails:
      type: object
      description: Public-facing agronomy, merchandising, and SEO fields only.
      properties:
        recordType: { type: string }
        botanicalName: { type: string }
        distributedBy: { type: string }
        tagline: { type: string, maxLength: 60 }
        blurb: { type: string }
        keyAttributes:
          type: array
          items: { type: string }
        distributionNote: { type: string }
        persistencyType: { type: string }
        ploidy: { type: string }
        flowerColour: { type: string }
        sowingRates:
          type: array
          items: { $ref: "#/components/schemas/ProductSowingRate" }
        rainfallMinMm: { type: [number, "null"] }
        soilPhMin: { type: [number, "null"] }
        soilPhScale: { type: string }
        soilRangeLightest: { type: string }
        soilRangeHeaviest: { type: string }
        tolerance:
          type: array
          items: { $ref: "#/components/schemas/ProductTolerance" }
        endUse: { type: array, items: { type: string } }
        livestock: { type: array, items: { type: string } }
        maturityMeasure: { type: string }
        maturityDays: { type: [number, "null"] }
        headingDate: { type: string }
        headingOffsetDays: { type: [number, "null"] }
        winterActivity: { type: [number, "null"] }
        argtResistant: { type: boolean }
        endophyte: { type: string }
        growthSeason: { type: string }
        hardSeedLevel: { type: string }
        oestrogenLevel: { type: string }
        bloatRisk: { type: string }
        growingSeason: { type: string }
        weeksToFirstGrazing: { type: string }
        prussicAcidRisk: { type: string }
        regrowth: { type: string }
        productForm: { type: string }
        applicationRate: { type: string }
        diseasePestResistance: { type: string }
        standLifeNotes: { type: string }
        grazingManagementNotes: { type: string }
        pbrProtected: { type: boolean }
        pbrDetails: { type: string }
        certification: { type: array, items: { type: string } }
        description: { type: string }
        components:
          type: array
          items: { $ref: "#/components/schemas/ProductComponent" }
        relatedProducts: { type: array, items: { type: string } }
        formulationYear: { type: string }
        photos:
          type: array
          items: { $ref: "#/components/schemas/ProductPhoto" }
        featured: { type: boolean }
        seoTitle: { type: string }
        seoDescription: { type: string }
      required: [recordType, botanicalName, distributedBy, tagline, blurb, keyAttributes, distributionNote, persistencyType, ploidy, flowerColour, sowingRates, rainfallMinMm, soilPhMin, soilPhScale, soilRangeLightest, soilRangeHeaviest, tolerance, endUse, livestock, maturityMeasure, maturityDays, headingDate, headingOffsetDays, winterActivity, argtResistant, endophyte, growthSeason, hardSeedLevel, oestrogenLevel, bloatRisk, growingSeason, weeksToFirstGrazing, prussicAcidRisk, regrowth, productForm, applicationRate, diseasePestResistance, standLifeNotes, grazingManagementNotes, pbrProtected, pbrDetails, certification, description, components, relatedProducts, formulationYear, photos, featured, seoTitle, seoDescription]
    ProductDraftInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: string, maxLength: 80 }
        packSize: { type: string, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 120 }
        subcategoryId: { type: number, multipleOf: 1, nullable: true }
        techSheet: { type: string, maxLength: 240 }
        guideYear: { type: string, maxLength: 12 }
        descriptionSource: { type: string, maxLength: 240 }
        websiteUrlLegacy: { type: string, maxLength: 500 }
        availabilityOverride: { type: [string, "null"], enum: ["Good stock", "Low stock", "Very low", Unavailable, null] }
        listingOverride: { type: [string, "null"], enum: ["Force active", "Force legacy", null] }
        details:
          $ref: "#/components/schemas/ProductDetails"
        saleLines:
          type: array
          items: { $ref: "#/components/schemas/SaleLine" }
      required: [name, price, packSize, status, note, category, techSheet, guideYear, descriptionSource, websiteUrlLegacy, availabilityOverride, listingOverride, details]
    ProductDraft:
      allOf:
        - $ref: "#/components/schemas/ProductDraftInput"
        - type: object
          properties:
            savedAt: { type: string, format: date-time }
          required: [savedAt]
    AdminProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            lifecycleStatus: { type: string, enum: [Published, Draft, Archived] }
            hasDraft: { type: boolean }
            draftSavedAt: { type: string, format: date-time, nullable: true }
            draft:
              oneOf:
                - $ref: "#/components/schemas/ProductDraft"
                - type: "null"
          required: [lifecycleStatus, hasDraft, draftSavedAt, draft]
    ProductInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 1, maxLength: 180, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        price: { type: string, maxLength: 80 }
        packSize: { type: string, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, maxLength: 120 }
        subcategoryId: { type: number, multipleOf: 1, nullable: true }
        techSheet: { type: string, maxLength: 240 }
        guideYear: { type: string, maxLength: 12 }
        descriptionSource: { type: string, maxLength: 240 }
        websiteUrlLegacy: { type: string, maxLength: 500 }
        availabilityOverride: { type: [string, "null"], enum: ["Good stock", "Low stock", "Very low", Unavailable, null] }
        listingOverride: { type: [string, "null"], enum: ["Force active", "Force legacy", null] }
        publishStatus: { type: string, enum: [Published, Draft, Archived] }
        details:
          $ref: "#/components/schemas/ProductDetails"
      required: [name, slug, price, packSize, status, note, category, techSheet, guideYear, descriptionSource, websiteUrlLegacy, availabilityOverride, listingOverride, publishStatus, details]
    ProductCreateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 1, maxLength: 180, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        price: { type: string, minLength: 1, maxLength: 80 }
        packSize: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 120 }
        subcategoryId: { type: number, multipleOf: 1, nullable: true }
        techSheet: { type: string, maxLength: 240 }
        details:
          $ref: "#/components/schemas/ProductDetails"
      required: [name, slug, price, packSize, status, note, category, techSheet, details]
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: string, minLength: 1, maxLength: 80 }
        packSize: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 120 }
        subcategoryId: { type: number, multipleOf: 1, nullable: true }
        techSheet: { type: string, maxLength: 240 }
        guideYear: { type: string, maxLength: 12 }
        descriptionSource: { type: string, maxLength: 240 }
        websiteUrlLegacy: { type: string, maxLength: 500 }
        availabilityOverride: { type: [string, "null"], enum: ["Good stock", "Low stock", "Very low", Unavailable, null] }
        listingOverride: { type: [string, "null"], enum: ["Force active", "Force legacy", null] }
        details:
          $ref: "#/components/schemas/ProductDetails"
    ProductDetails:
      type: object
      properties:
        stockCode: { type: string, maxLength: 40 }
        guideSection: { type: string, maxLength: 120 }
        recordType: { type: string, enum: [Mix, Variety, "Commodity / generic"] }
        botanicalName: { type: string, maxLength: 180 }
        alsoKnownAs:
          type: array
          items: { type: string, maxLength: 120 }
        packSizes:
          type: array
          items:
            $ref: "#/components/schemas/ProductPackSize"
        treatment: { type: string, maxLength: 120 }
        persistencyType: { type: string, enum: ["", Annual, Biennial, Perennial, "Hybrid perennial", "Short-term (1–2 years)"] }
        ploidy: { type: string, enum: ["", Diploid, Tetraploid, Hexaploid, "Mixed (blend)"] }
        flowerColour: { type: string, enum: ["", Pink, Yellow, White, Crimson, Red, Purple] }
        bredByOrigin: { type: string, maxLength: 2000 }
        australianBred: { type: boolean }
        distributedBy: { type: string, maxLength: 120 }
        sowingRates:
          type: array
          items:
            $ref: "#/components/schemas/ProductSowingRate"
        rainfallMinMm: { type: number, minimum: 0, multipleOf: 1, nullable: true }
        soilPhMin: { type: number, minimum: 0, maximum: 14, nullable: true }
        soilPhScale: { type: string, enum: ["CaCl₂", water] }
        soilRangeLightest: { type: string, enum: ["", LS, S, L, H] }
        soilRangeHeaviest: { type: string, enum: ["", LS, S, L, H] }
        sowingDepthMinCm: { type: number, minimum: 0, nullable: true }
        sowingDepthMaxCm: { type: number, minimum: 0, nullable: true }
        tolerance:
          type: array
          items:
            $ref: "#/components/schemas/ProductTolerance"
        maturityMeasure: { type: string, enum: ["", "Days to flowering (Perth)", "Heading date", "Time of flowering", "Winter activity rating"] }
        maturityDays: { type: number, minimum: 0, multipleOf: 1, nullable: true }
        headingDate: { type: string, enum: ["", "Very early", Early, Mid, "Mid-late", Late] }
        floweringWindow: { type: string, maxLength: 80 }
        winterActivity: { type: number, minimum: 1, maximum: 10, multipleOf: 1, nullable: true }
        inoculantGroup: { type: string, enum: [None, C, "G/S", G, S, AL, AM, B, BS, E, "F/E", I] }
        seedTreatment:
          type: array
          items: { type: string, enum: ["Bare / untreated", Gaucho, Thiram, Goldstrike, "BioNPK Powder S", "Lime coated"] }
        ecocertApproved: { type: boolean }
        endUse:
          type: array
          items: { type: string, enum: [Grazing, Hay, Silage, "Cover crop", "Green manure", Grain, Stockfeed, "Permanent pasture", "Erosion control / stabilisation", "Break crop", Biofumigant, Turf] }
        livestock:
          type: array
          items: { type: string, enum: [Beef, Dairy, Sheep, Equine, Goat, Chicken, Alpaca, Weaners, "Lamb finishing"] }
        companionSpecies:
          type: array
          items: { type: string, maxLength: 120 }
