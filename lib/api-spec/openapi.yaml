openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalogue
    description: Seed catalogue and availability
  - name: enquiries
    description: Advice enquiries
  - name: admin
    description: IH Seeds backoffice product management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalogue]
      summary: List pasture seed products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "409":
          description: Product name already exists
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "404":
          description: Product not found
        "409":
          description: Product name already exists
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get product management dashboard summary
      responses:
        "200":
          description: Product management summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /availability:
    get:
      operationId: listAvailability
      tags: [catalogue]
      summary: List current seed availability
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityRow"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit an advice enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryCreated"
        "400":
          description: Invalid enquiry
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        price: { type: string }
        packSize: { type: string }
        status: { type: string }
        note: { type: string }
        category: { type: string }
        techSheet: { type: string }
        publishStatus: { type: string }
        details:
          $ref: "#/components/schemas/ProductDetails"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, price, packSize, status, note, category, techSheet, publishStatus, details, createdAt, updatedAt]
    ProductInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: string, minLength: 1, maxLength: 80 }
        packSize: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 120 }
        techSheet: { type: string, maxLength: 240 }
        publishStatus: { type: string, enum: [Published, Draft] }
        details:
          $ref: "#/components/schemas/ProductDetails"
      required: [name, price, packSize, status, note, category, techSheet, publishStatus, details]
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: string, minLength: 1, maxLength: 80 }
        packSize: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 120 }
        techSheet: { type: string, maxLength: 240 }
        publishStatus: { type: string, enum: [Published, Draft] }
        details:
          $ref: "#/components/schemas/ProductDetails"
    ProductDetails:
      type: object
      properties:
        stockCode: { type: string, maxLength: 40 }
        guideSection: { type: string, maxLength: 120 }
        treatment: { type: string, maxLength: 120 }
        kind: { type: string, enum: [Mix, Variety] }
        rate: { type: string, maxLength: 80 }
        rainfall: { type: string, maxLength: 80 }
        flowering: { type: string, maxLength: 100 }
        inoculant: { type: string, maxLength: 80 }
        soil:
          type: array
          items: { type: string }
        tolerance:
          type: array
          items: { type: string }
        livestock:
          type: array
          items: { type: string }
        summary: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 5000 }
        notes: { type: string, maxLength: 2000 }
        components:
          type: array
          items:
            $ref: "#/components/schemas/ProductComponent"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ProductPhoto"
      required: [stockCode, guideSection, treatment, kind, rate, rainfall, flowering, inoculant, soil, tolerance, livestock, summary, description, notes, components, photos]
    ProductComponent:
      type: object
      properties:
        name: { type: string }
        note: { type: string }
      required: [name, note]
    ProductPhoto:
      type: object
      properties:
        slot: { type: string }
        file: { type: string }
        rating: { type: string }
        src: { type: string }
      required: [slot, file, rating, src]
    AdminSummary:
      type: object
      properties:
        totalProducts: { type: number }
        publishedProducts: { type: number }
        lowStockProducts: { type: number }
        missingTechSheets: { type: number }
        recentProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required: [totalProducts, publishedProducts, lowStockProducts, missingTechSheets, recentProducts]
    AvailabilityRow:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        note: { type: string }
        status: { type: string }
      required: [id, name, note, status]
    EnquiryInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 40 }
        topic: { type: string, minLength: 1, maxLength: 120 }
        message: { type: string, minLength: 10, maxLength: 4000 }
      required: [name, email, topic, message]
    EnquiryCreated:
      type: object
      properties:
        ok: { type: boolean }
        id: { type: number }
        createdAt: { type: string, format: date-time }
      required: [ok, id, createdAt]

