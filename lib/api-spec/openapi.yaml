openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalogue
    description: Seed catalogue and availability
  - name: enquiries
    description: Advice enquiries
  - name: admin
    description: IH Seeds backoffice product management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalogue]
      summary: List pasture seed products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "409":
          description: Product name already exists
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "404":
          description: Product not found
        "409":
          description: Product name already exists
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get product management dashboard summary
      responses:
        "200":
          description: Product management summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List catalogue products with lifecycle metadata
      responses:
        "200":
          description: Admin catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getAdminProduct
      tags: [admin]
      summary: Get a product and its current draft revision
      responses:
        "200":
          description: Admin product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
  /admin/products/{id}/draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: saveProductDraftRevision
      tags: [admin]
      summary: Save a product draft revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDraftInput"
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          description: Invalid draft
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: publishProduct
      tags: [admin]
      summary: Promote the current draft to the public catalogue
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: archiveProduct
      tags: [admin]
      summary: Move a product to the archive
      responses:
        "200":
          description: Archived product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: restoreProduct
      tags: [admin]
      summary: Restore an archived product to Draft
      responses:
        "200":
          description: Draft product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/discard-draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: discardProductDraft
      tags: [admin]
      summary: Discard pending changes to a published product
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /availability:
    get:
      operationId: listAvailability
      tags: [catalogue]
      summary: List current seed availability
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityRow"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [enquiries]
      summary: Submit an advice enquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryCreated"
        "400":
          description: Invalid enquiry
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        price: { type: string }
        packSize: { type: string }
        status: { type: string }
        note: { type: string }
        category: { type: string }
        techSheet: { type: string }
        publishStatus: { type: string, enum: [Published, Draft, Archived] }
        publishedAt: { type: string, format: date-time, nullable: true }
        details:
          $ref: "#/components/schemas/ProductDetails"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, slug, price, packSize, status, note, category, techSheet, publishStatus, details, createdAt, updatedAt]
    ProductDraftInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: string, minLength: 1, maxLength: 80 }
        packSize: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 120 }
        techSheet: { type: string, maxLength: 240 }
        details:
          $ref: "#/components/schemas/ProductDetails"
      required: [name, price, packSize, status, note, category, techSheet, details]
    ProductDraft:
      allOf:
        - $ref: "#/components/schemas/ProductDraftInput"
        - type: object
          properties:
            savedAt: { type: string, format: date-time }
          required: [savedAt]
    AdminProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            lifecycleStatus: { type: string, enum: [Published, Draft, Archived] }
            hasDraft: { type: boolean }
            draftSavedAt: { type: string, format: date-time, nullable: true }
            draft:
              oneOf:
                - $ref: "#/components/schemas/ProductDraft"
                - type: "null"
          required: [lifecycleStatus, hasDraft, draftSavedAt, draft]
    ProductInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 1, maxLength: 180, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        price: { type: string, minLength: 1, maxLength: 80 }
        packSize: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 120 }
        techSheet: { type: string, maxLength: 240 }
        publishStatus: { type: string, enum: [Published, Draft, Archived] }
        details:
          $ref: "#/components/schemas/ProductDetails"
      required: [name, slug, price, packSize, status, note, category, techSheet, publishStatus, details]
    ProductCreateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 1, maxLength: 180, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        price: { type: string, minLength: 1, maxLength: 80 }
        packSize: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 120 }
        techSheet: { type: string, maxLength: 240 }
        details:
          $ref: "#/components/schemas/ProductDetails"
      required: [name, slug, price, packSize, status, note, category, techSheet, details]
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        price: { type: string, minLength: 1, maxLength: 80 }
        packSize: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [in-stock, low, very-low, unavailable] }
        note: { type: string, maxLength: 500 }
        category: { type: string, minLength: 1, maxLength: 120 }
        techSheet: { type: string, maxLength: 240 }
        details:
          $ref: "#/components/schemas/ProductDetails"
    ProductDetails:
      type: object
      properties:
        stockCode: { type: string, maxLength: 40 }
        guideSection: { type: string, maxLength: 120 }
        recordType: { type: string, enum: [Mix, Variety, "Commodity / generic"] }
        botanicalName: { type: string, maxLength: 180 }
        alsoKnownAs:
          type: array
          items: { type: string, maxLength: 120 }
        packSizes:
          type: array
          items:
            $ref: "#/components/schemas/ProductPackSize"
        treatment: { type: string, maxLength: 120 }
        persistencyType: { type: string, enum: ["", Annual, Biennial, Perennial, "Hybrid perennial", "Short-term (1–2 years)"] }
        ploidy: { type: string, enum: ["", Diploid, Tetraploid, Hexaploid, "Mixed (blend)"] }
        flowerColour: { type: string, enum: ["", Pink, Yellow, White, Crimson, Red, Purple] }
        bredByOrigin: { type: string, maxLength: 180 }
        australianBred: { type: boolean }
        distributedBy: { type: string, maxLength: 120 }
        sowingRates:
          type: array
          items:
            $ref: "#/components/schemas/ProductSowingRate"
        rainfallMinMm: { type: number, minimum: 0, multipleOf: 1, nullable: true }
        soilPhMin: { type: number, minimum: 0, maximum: 14, nullable: true }
        soilPhScale: { type: string, enum: ["CaCl₂", water] }
        soilRangeLightest: { type: string, enum: ["", LS, S, L, H] }
        soilRangeHeaviest: { type: string, enum: ["", LS, S, L, H] }
        sowingDepthMinCm: { type: number, minimum: 0, nullable: true }
        sowingDepthMaxCm: { type: number, minimum: 0, nullable: true }
        tolerance:
          type: array
          items:
            $ref: "#/components/schemas/ProductTolerance"
        maturityMeasure: { type: string, enum: ["", "Days to flowering (Perth)", "Heading date", "Time of flowering", "Winter activity rating"] }
        maturityDays: { type: number, minimum: 0, multipleOf: 1, nullable: true }
        headingDate: { type: string, enum: ["", "Very early", Early, Mid, "Mid-late", Late] }
        floweringWindow: { type: string, maxLength: 80 }
        winterActivity: { type: number, minimum: 1, maximum: 10, multipleOf: 1, nullable: true }
        inoculantGroup: { type: string, enum: [None, C, "G/S", G, S, AL, AM, B, BS, E, "F/E", I] }
        seedTreatment:
          type: array
          items: { type: string, enum: ["Bare / untreated", Gaucho, Thiram, Goldstrike, "BioNPK Powder S", "Lime coated"] }
        ecocertApproved: { type: boolean }
        endUse:
          type: array
          items: { type: string, enum: [Grazing, Hay, Silage, "Cover crop", "Green manure", Grain, Stockfeed, "Permanent pasture", "Erosion control / stabilisation", "Break crop", Biofumigant, Turf] }
        livestock:
          type: array
          items: { type: string, enum: [Beef, Dairy, Sheep, Equine, Goat, Chicken, Alpaca, Weaners, "Lamb finishing"] }
        companionSpecies:
          type: array
          items: { type: string, maxLength: 120 }
        diseasePestResistance: { type: string, maxLength: 3000 }
        persistenceLongevity: { type: string, maxLength: 180 }
        grazingManagementNotes: { type: string, maxLength: 3000 }
        pbrProtected: { type: boolean }
        pbrDetails: { type: string, maxLength: 300 }
        licenceRestriction: { type: string, maxLength: 1000 }
        certification:
          type: array
          items: { type: string, enum: ["ASF Code of Practice", "Certified Quality Assured Seed", "Certified seed", "Licensed production"] }
        isThirdPartyProduct: { type: boolean }
        supplierName: { type: string, maxLength: 180 }
        summary: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 5000 }
        notes: { type: string, maxLength: 2000 }
        components:
          type: array
          items:
            $ref: "#/components/schemas/ProductComponent"
        formulationYear: { type: string, maxLength: 20 }
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ProductPhoto"
        inCurrentPrintedGuide: { type: boolean }
        seoTitle: { type: string, maxLength: 180 }
        seoDescription: { type: string, maxLength: 320 }
        sortOrder: { type: number, minimum: 0, multipleOf: 1, nullable: true }
        featured: { type: boolean }
        relatedProducts:
          type: array
          items: { type: string, maxLength: 180 }
      required: [stockCode, guideSection, recordType, botanicalName, alsoKnownAs, packSizes, treatment, persistencyType, ploidy, flowerColour, bredByOrigin, australianBred, distributedBy, sowingRates, rainfallMinMm, soilPhMin, soilPhScale, soilRangeLightest, soilRangeHeaviest, sowingDepthMinCm, sowingDepthMaxCm, tolerance, maturityMeasure, maturityDays, headingDate, floweringWindow, winterActivity, inoculantGroup, seedTreatment, ecocertApproved, endUse, livestock, companionSpecies, diseasePestResistance, persistenceLongevity, grazingManagementNotes, pbrProtected, pbrDetails, licenceRestriction, certification, isThirdPartyProduct, supplierName, summary, description, notes, components, formulationYear, photos, inCurrentPrintedGuide, seoTitle, seoDescription, sortOrder, featured, relatedProducts]
    ProductPackSize:
      type: object
      properties:
        label: { type: string, maxLength: 80 }
        size: { type: number, minimum: 0, nullable: true }
        unit: { type: string, maxLength: 30 }
      required: [label, size, unit]
    ProductSowingRate:
      type: object
      properties:
        context: { type: string, enum: [Monoculture, "In a mix", Dryland, Irrigation, Pasture, Turf] }
        min: { type: number, minimum: 0, nullable: true }
        max: { type: number, minimum: 0, nullable: true }
        unit: { type: string, maxLength: 20 }
      required: [context, min, max, unit]
    ProductTolerance:
      type: object
      properties:
        name: { type: string, enum: ["Low pH", Waterlogging, Salinity, Drought, Frost] }
        mild: { type: boolean }
      required: [name, mild]
    ProductComponent:
      type: object
      properties:
        productLink: { type: string, maxLength: 180 }
        speciesName: { type: string, maxLength: 120 }
        inclusionRate: { type: number, minimum: 0, nullable: true }
        unit: { type: string, maxLength: 20 }
        note: { type: string, maxLength: 240 }
      required: [productLink, speciesName, inclusionRate, unit, note]
    ProductPhoto:
      type: object
      properties:
        slot: { type: string, maxLength: 40 }
        file: { type: string, maxLength: 240 }
        rating: { type: string, maxLength: 80 }
        src: { type: string, maxLength: 500 }
      required: [slot, file, rating, src]
    AdminSummary:
      type: object
      properties:
        totalProducts: { type: number }
        publishedProducts: { type: number }
        draftProducts: { type: number }
        archivedProducts: { type: number }
        pendingDrafts: { type: number }
        lowStockProducts: { type: number }
        missingTechSheets: { type: number }
        recentProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required: [totalProducts, publishedProducts, draftProducts, archivedProducts, pendingDrafts, lowStockProducts, missingTechSheets, recentProducts]
    AvailabilityRow:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        note: { type: string }
        status: { type: string }
      required: [id, name, note, status]
    EnquiryInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 40 }
        topic: { type: string, minLength: 1, maxLength: 120 }
        message: { type: string, minLength: 10, maxLength: 4000 }
      required: [name, email, topic, message]
    EnquiryCreated:
      type: object
      properties:
        ok: { type: boolean }
        id: { type: number }
        createdAt: { type: string, format: date-time }
      required: [ok, id, createdAt]

