openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalogue
    description: Seed catalogue and availability
  - name: enquiries
    description: Advice enquiries
  - name: admin
    description: IH Seeds backoffice product management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Resolve the current administrator session
      security:
        - clerkSession: []
      responses:
        "200":
          description: Authorized administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: No active sign-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "403":
          description: Signed in without the administrator role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/administrators:
    get:
      operationId: getAdministrators
      tags: [admin]
      summary: List active administrators, pending approvals, and access audit history
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Administrator access management data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdministratorAccessList" }
        "401": { description: Sign in is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Administrator access is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /admin/administrators/approvals:
    post:
      operationId: createAdministratorApproval
      tags: [admin]
      summary: Approve one exact email to claim administrator access
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorApprovalInput" }
      responses:
        "200":
          description: Approval created
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid email address, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Sign in is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Administrator access is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Email is already active or pending, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: deleteAdministratorApproval
      tags: [admin]
      summary: Cancel one pending administrator email approval
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorApprovalInput" }
      responses:
        "200":
          description: Pending approval cancelled
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid email address, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Sign in is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Administrator access is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Email has no pending approval, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /admin/administrators/access:
    delete:
      operationId: revokeAdministratorAccess
      tags: [admin]
      summary: Revoke an administrator, preserving the final active administrator
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorAccessRevocationInput" }
      responses:
        "200":
          description: Administrator access revoked
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid administrator id, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Sign in is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Administrator access is required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Cannot revoke the final administrator or an unavailable account, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /products:
    get:
      operationId: listProducts
      tags: [catalogue]
      summary: List pasture seed products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicProduct"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a product
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/ProductReferenceValidationError"
        "409":
          description: Product name already exists
  /products/slug/{slug}:
    get:
      operationId: getProductBySlug
      tags: [catalogue]
      summary: Get one published active product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published active product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProduct"
        "404":
          description: Product is not published, active, or does not exist
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
        "404":
          description: Product not found
        "409":
          description: Product name already exists
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Delete a product
      security:
        - clerkSession: []
      responses:
        "204":
          description: Product deleted
        "404":
          description: Product not found
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get product management dashboard summary
      security:
        - clerkSession: []
      responses:
        "200":
          description: Product management summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List catalogue products with lifecycle metadata
      security:
        - clerkSession: []
      responses:
        "200":
          description: Admin catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getAdminProduct
      tags: [admin]
      summary: Get a product and its current draft revision
      security:
        - clerkSession: []
      responses:
        "200":
          description: Admin product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
  /admin/products/{id}/draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: saveProductDraftRevision
      tags: [admin]
      summary: Save edits to a Draft product
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDraftInput"
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          description: Invalid draft
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ApiError"
                  - $ref: "#/components/schemas/ProductReferenceValidationError"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: publishProduct
      tags: [admin]
      summary: Publish a product, optionally from the current editor payload
      security:
        - clerkSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductDraftInput"
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          description: Product is missing fields required for publication
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PublishValidationError"
                  - $ref: "#/components/schemas/ProductReferenceValidationError"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: archiveProduct
      tags: [admin]
      summary: Move a product to the archive
      security:
        - clerkSession: []
      responses:
        "200":
          description: Archived product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: restoreProduct
      tags: [admin]
      summary: Restore an archived product to Draft
      security:
        - clerkSession: []
      responses:
        "200":
          description: Draft product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/products/{id}/discard-draft:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: discardProductDraft
      tags: [admin]
      summary: Discard leftover unpublished revisions on a published product
      security:
        - clerkSession: []
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
        "409":
          description: Invalid lifecycle transition
  /admin/product-images/request-upload:
    post:
      operationId: requestProductImageUpload
      tags: [admin]
      summary: Request a direct WebP product image upload
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductImageUploadRequest" }
      responses:
        "200":
          description: Presigned upload details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductImageUploadResponse" }
        "400": { description: Invalid image metadata }
  /admin/product-images:
    delete:
      operationId: deleteProductImage
      tags: [admin]
      summary: Delete an abandoned or removed product image
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteProductImageRequest" }
      responses:
        "204": { description: Image deleted }
        "400": { description: Invalid object path }
        "409": { description: Image is still referenced by a product or draft }
  /storage/objects/product-images/{productSlug}/{fileName}:
    get:
      operationId: getProductImage
      tags: [catalogue]
      summary: Serve a public product image
      parameters:
        - { name: productSlug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" } }
        - { name: fileName, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]+-[a-f0-9]{12,64}-(?:full|card)\\.webp$" } }
      responses:
        "200": { description: Image bytes, content: { image/webp: { schema: { type: string, format: binary } } } }
        "404": { description: Image not found }
  /admin/media:
    get:
      operationId: listMediaAssets
      tags: [admin]
      summary: List the private shared image library and usage counts
      security: [{ clerkSession: [] }]
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 160 } }
        - { name: usage, in: query, schema: { type: string, enum: [unassigned, draft, published, mixed] } }
        - { name: area, in: query, schema: { type: string, enum: [product, category, static] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: number, multipleOf: 1, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: A page of library assets
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaAssetPage" } } }
  /admin/media/upload-request:
    post:
      operationId: requestMediaUpload
      tags: [admin]
      summary: Request direct private upload for a JPEG, PNG, or WebP library image
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadInput" } } }
      responses:
        "201":
          description: Presigned upload details
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadRequestResult" } } }
        "200":
          description: Exact known duplicate; reuse the returned asset
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaUploadRequestResult" } } }
        "400": { description: Unsupported type or file too large }
  /admin/media/backfill:
    post:
      operationId: backfillMediaUsage
      tags: [admin]
      summary: Idempotently reconcile durable media references from catalogue and static manifest
      security: [{ clerkSession: [] }]
      responses:
        "200":
          description: Usage index reconciled
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaBackfillResult" } } }
  /admin/media/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getMediaAsset
      tags: [admin]
      summary: Get library metadata and every known use
      security: [{ clerkSession: [] }]
      responses:
        "200": { description: Media asset, content: { application/json: { schema: { $ref: "#/components/schemas/MediaAssetDetail" } } } }
        "404": { description: Asset not found }
    patch:
      operationId: updateMediaAsset
      tags: [admin]
      summary: Update library defaults without changing existing product snapshots
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MediaMetadataUpdate" } } }
      responses:
        "200": { description: Updated asset, content: { application/json: { schema: { $ref: "#/components/schemas/MediaAsset" } } } }
        "400": { description: Invalid metadata }
        "404": { description: Asset not found }
    delete:
      operationId: deleteMediaAsset
      tags: [admin]
      summary: Delete an unreferenced library asset after confirmation
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MediaDeleteConfirmation" } } }
      responses:
        "204": { description: Asset deleted }
        "400": { description: Confirmation required }
        "404": { description: Asset not found }
        "409":
          description: Asset has product, category, or static references
          content: { application/json: { schema: { $ref: "#/components/schemas/MediaInUseError" } } }
  /admin/media/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: completeMediaUpload
      tags: [admin]
      summary: Verify uploaded object bytes and mark a library asset ready
      security: [{ clerkSession: [] }]
      responses:
        "200": { description: Verified ready asset, content: { application/json: { schema: { $ref: "#/components/schemas/MediaAsset" } } } }
        "400": { description: "Missing, corrupt, unsupported, or oversized object" }
        "404": { description: Asset not found }
        "409": { description: Exact duplicate; reuse existing asset }
  /admin/media/{id}/attach:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: attachMediaAsset
      tags: [admin]
      summary: Insert a library image as a product hero and shift existing photos down
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MediaAttachInput" } } }
      responses:
        "200": { description: Attached asset, content: { application/json: { schema: { $ref: "#/components/schemas/MediaAsset" } } } }
        "400": { description: Missing product }
        "404": { description: Asset or product not found }
        "409": { description: Product is archived }
  /admin/media/{id}/object:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: putMediaObject
      tags: [admin]
      summary: Upload original JPEG, PNG, or WebP bytes for a pending library asset
      security: [{ clerkSession: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Original bytes stored }
        "400": { description: Invalid or oversized object }
        "404": { description: Asset not found }
  /admin/media/{id}/preview:
    get:
      operationId: previewMediaAsset
      tags: [admin]
      summary: Serve an authenticated private preview of a ready asset
      security: [{ clerkSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Private image bytes }
        "404": { description: Asset not found or not ready }
  /media/{id}:
    get:
      operationId: getPublishedMediaAsset
      tags: [catalogue]
      summary: Serve a library image only when it has a published reference
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Public image bytes }
        "404": { description: Asset not published or not found }
  /availability:
    get:
      operationId: listAvailability
      tags: [catalogue]
      summary: List current seed availability
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityRow"
  /products/category/{category}/legacy:
    get:
      operationId: listLegacyCategoryNames
      tags: [catalogue]
      summary: List Legacy product names only
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Legacy names
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LegacyProductName" }
  /redirects/lookup:
    get:
      operationId: lookupRedirect
      tags: [catalogue]
      summary: Resolve a legacy SPA path
      parameters:
        - name: fromPath
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Redirect target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedirectLookup" }
        "404": { description: Redirect not found }
  /sitemap-products:
    get:
      operationId: getProductSitemap
      tags: [catalogue]
      summary: Active product sitemap
      responses:
        "200":
          description: XML sitemap
          content:
            application/xml:
              schema: { type: string }
  /admin/import/dry-run:
    post:
      operationId: dryRunProductImport
      tags: [admin]
      summary: Validate an XLSX import
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbookUpload" }
      responses:
        "200":
          description: Dry-run report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbookReport" }
  /admin/import/commit:
    post:
      operationId: commitProductImport
      tags: [admin]
      summary: Commit a validated XLSX import
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkbookCommit" }
      responses:
        "200":
          description: Import committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkbookReport" }
        "400": { description: Invalid or stale token }
  /admin/import/export:
    get:
      operationId: exportProductWorkbook
      tags: [admin]
      summary: Export product workbook
      security:
        - clerkSession: []
      responses:
        "200":
          description: XLSX export
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /categories:
    get:
      operationId: listCategories
      tags: [catalogue]
      summary: List active catalogue categories
      responses:
        "200":
          description: Active ordered category taxonomy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicCatalogueCategory"
  /admin/categories:
    get:
      operationId: listAdminCategories
      tags: [admin]
      summary: List all catalogue categories
      security:
        - clerkSession: []
      responses:
        "200":
          description: Category records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueCategory" }
    post:
      operationId: createCategory
      tags: [admin]
      summary: Create a catalogue category
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueCategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueCategory" }
        "400": { description: Invalid category or parent }
        "409": { description: Category slug already exists }
  /admin/categories/reorder:
    post:
      operationId: reorderCategories
      tags: [admin]
      summary: Reorder catalogue categories
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueCategoryReorder" }
      responses:
        "200":
          description: Reordered categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogueCategory" }
        "400": { description: Invalid reorder request }
        "404": { description: Category not found }
  /admin/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: updateCategory
      tags: [admin]
      summary: Update a catalogue category or its active state
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogueCategoryUpdate" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogueCategory" }
        "400": { description: Invalid category or parent }
        "404": { description: Category not found }
        "409": { description: Category slug already exists }
    delete:
      operationId: deleteCategory
      tags: [admin]
      summary: Delete an unused catalogue category
      security:
        - clerkSession: []
      responses:
        "204": { description: Category deleted }
        "404": { description: Category not found }
        "409": { description: Category still has products or subcategories }
  /enquiries:
